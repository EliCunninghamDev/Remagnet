name: remagnet

# The page is served over HTTP so the Chrome content script can report the
# hovered link. The addon is the normal Chrome build plus a local mock client.
extension: ./.build/addon
serve: ./page
url: /index.html

viewport: 1280x800
scale: 2
seed: 7

output:
  dir: ./out
  formats: [gif, mp4]
  width: 800
  fps: 12
  video_fps: 30
  gif_max_mb: 10

camera:
  auto_zoom: false
  default_level: 1.0
  transition_ms: 700
  follow: false

targets:
  # The popover is a native surface, so it has no selector. Its 440px width and
  # toolbar anchor put it at a fixed place in the 1280x800 capture.
  popover: { rect: [1418, 150, 872, 570] }
  # Its small monospace labels are not reliable OCR, so the submit button is a
  # template captured from the same layout.
  send: { image: ./assets/send-button.png, threshold: 0.82 }
  # The completed row's ZIP action is also a native control. Rows are a fixed
  # height and the newest torrent is always first, so the action rect is stable.
  zip: { rect: [2130, 390, 110, 32] }

steps:
  - wait: 900
  - move: "#magnet"
  - wait: 250
  - rightclick: "#magnet"
  - wait: 500
  - screenshot: context-menu

  # The native menu is not in the page DOM, so it is located with OCR. Zoom
  # also makes the item legible in the final clip.
  - zoom:
      target: { text: "Add to Remagnet" }
      level: 1.8
      hold: 600
  - click: { text: "Add to Remagnet" }

  # The popover fades in behind a dismissed menu. Pull back to the full page so
  # the camera is not parked on nothing while it opens, then frame it once it
  # is opaque.
  - zoom: { level: 1.0, duration_ms: 300, hold: 650 }

  # The review screenshot exists to refresh the button template. Take it before
  # the zoom so the click follows the camera move directly.
  - screenshot: review

  # The target lookup and the pointer move take long enough on their own, so
  # only a short hold is needed for the zoom to land before the click.
  - zoom:
      target: popover
      level: 1.65
      duration_ms: 750
      hold: 250
  - click: send
  - wait: 1500

  # The popover returns to the list after a successful add. Move off the rows
  # so a native title tooltip does not open on camera.
  - move: { x: 300, y: 1200 }
  - wait: 1800
  - screenshot: list
  - wait: 250

  # The added torrent finishes while the camera settles. The ZIP action is the
  # final interaction; the popover is still framed at 1.65.
  - zoom: { target: popover, level: 1.65, duration_ms: 350, hold: 250 }
  - click: zip
  - wait: 1500
