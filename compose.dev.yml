name: remagnet-dev

services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: UTC
    ports:
      - "127.0.0.1:19091:9091"
    volumes:
      - transmission-config:/config
      - ./.dev/dev-stack/transmission/downloads:/downloads

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    profiles: ["qbit"]
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: UTC
      WEBUI_PORT: "8080"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./.dev/dev-stack/qbittorrent/config:/config
      - ./.dev/dev-stack/qbittorrent/downloads:/downloads

  deluge:
    image: lscr.io/linuxserver/deluge:latest
    profiles: ["deluge"]
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: UTC
    ports:
      - "127.0.0.1:18112:8112"
    volumes:
      - ./.dev/dev-stack/deluge/config:/config
      - ./.dev/dev-stack/deluge/downloads:/downloads

  rtorrent:
    image: crazymax/rtorrent-rutorrent:latest
    profiles: ["rtorrent"]
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: UTC
      XMLRPC_PORT: "8000"
      RUTORRENT_PORT: "8080"
    ports:
      - "127.0.0.1:18000:8000"
      - "127.0.0.1:18082:8080"
    volumes:
      - ./.dev/dev-stack/rtorrent/config:/data
      - ./.dev/dev-stack/rtorrent/downloads:/downloads

  remagnet-proxy:
    build:
      context: ./proxy
    profiles: ["proxy"]
    environment:
      DATA_DIR: /data
      BIND_ADDR: 0.0.0.0:8080
      CLIENT_KIND: "${DEV_CLIENT_KIND:-transmission}"
      CLIENT_BASE_URL: "${DEV_CLIENT_BASE_URL:-http://transmission:9091}"
      DOWNLOADS_DIR: /downloads
      CLIENT_DOWNLOADS_DIR: /downloads
      REMAGNET_CATEGORY: "${DEV_REMAGNET_CATEGORY:-}"
      REMAGNET_TAGS: "${DEV_REMAGNET_TAGS:-remagnet}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - proxy-data:/data
      - ./.dev/dev-stack/transmission/downloads:/downloads:ro

volumes:
  transmission-config:
  proxy-data:
