services:
  deluge:
    image: lscr.io/linuxserver/deluge:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
    ports:
      - "18112:8112"
    volumes:
      - ./tmp/deluge/config:/config
      - ./tmp/deluge/downloads:/downloads

  remagnet-proxy:
    build:
      context: ../../proxy
    environment:
      DATA_DIR: /data
      BIND_ADDR: 0.0.0.0:8080
      SETUP_CODE: integration-setup-code
      CLIENT_KIND: deluge
      CLIENT_BASE_URL: http://deluge:8112
      DELUGE_PASSWORD: deluge
      DOWNLOADS_DIR: /downloads
      CLIENT_DOWNLOADS_DIR: /downloads
      REMAGNET_CATEGORY: remagnet
      REMAGNET_TAGS: ""
    ports:
      - "18081:8080"
    volumes:
      - ./tmp/deluge/proxy-data:/data
      - ./tmp/deluge/downloads:/downloads:ro
    depends_on:
      - deluge
