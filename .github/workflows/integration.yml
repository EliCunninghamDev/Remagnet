name: Integration

on:
  push:
    branches:
      - main
    paths:
      - "proxy/**"
      - "tests/integration/**"
      - ".github/workflows/integration.yml"
  pull_request:
    paths:
      - "proxy/**"
      - "tests/integration/**"
      - ".github/workflows/integration.yml"
  schedule:
    # Weekly regression run against upstream torrent client images.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-suite:
    name: Proxy + ${{ matrix.client }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        client:
          - qbittorrent
          - transmission
          - deluge
          - rtorrent

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - name: Prepare fixture directories
        run: bun run tests/integration/prepare.ts --client ${{ matrix.client }}

      - name: Start ${{ matrix.client }} and Remagnet Proxy
        run: |
          # lscr.io rate-limits bursts of image pulls, and the four matrix jobs
          # start together. Back off and retry instead of failing the run.
          for attempt in 1 2 3 4 5; do
            if docker compose -f tests/integration/compose.${{ matrix.client }}.yml up -d --build; then
              exit 0
            fi
            echo "compose up failed (attempt ${attempt}/5); retrying in $((attempt * 15))s" >&2
            docker compose -f tests/integration/compose.${{ matrix.client }}.yml down -v --remove-orphans || true
            sleep $((attempt * 15))
          done
          echo "compose up failed after 5 attempts" >&2
          exit 1

      - name: Run integration suite
        run: bun run tests/integration/run.ts --client ${{ matrix.client }}

      - name: Dump qBittorrent WebUI log on failure
        if: failure() && matrix.client == 'qbittorrent'
        run: |
          docker compose -f tests/integration/compose.qbittorrent.yml exec -T qbittorrent \
            cat /config/qBittorrent/data/logs/qbittorrent.log || true
          docker compose -f tests/integration/compose.qbittorrent.yml exec -T qbittorrent \
            cat /config/qBittorrent/qBittorrent.conf || true

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f tests/integration/compose.${{ matrix.client }}.yml logs --no-color

      - name: Tear down containers
        if: always()
        run: docker compose -f tests/integration/compose.${{ matrix.client }}.yml down -v
