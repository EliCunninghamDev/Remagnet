name: Android

on:
  push:
    paths:
      - "android/**"
      - "packages/proxy-client/**"
      - "proxy/openapi.yaml"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "packages/proxy-client/**"
      - "proxy/openapi.yaml"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest includes the Android command-line tools, but not the
      # platform this project compiles against.
      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.2" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and lint
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      # Debug builds are signed with the runner's generated debug key, so this
      # artifact installs without repository secrets. Release signing is a
      # separate workflow once a release key exists; see android/PLAN.md.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: remagnet-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
