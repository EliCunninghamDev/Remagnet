name: Android release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.2" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # A tag looks like android-v0.1.0. The run number is monotonic, so a
      # later tag always installs over an earlier one.
      - name: Derive version
        run: |
          if [[ "$GITHUB_REF" != refs/tags/android-v* ]]; then
            echo "::error::Run this workflow from an android-v* tag, not a branch."
            exit 1
          fi
          version="${GITHUB_REF_NAME#android-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not android-vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured. Add the release signing secrets described in android/PLAN.md."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/remagnet-release.jks"

      - name: Unit tests and lint
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Build signed APK and bundle
        working-directory: android
        env:
          REMAGNET_KEYSTORE: ${{ runner.temp }}/remagnet-release.jks
          REMAGNET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          REMAGNET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REMAGNET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -Premagnet.versionName="$VERSION_NAME" \
            -Premagnet.versionCode="$VERSION_CODE"

      - name: Verify the release APK
        working-directory: android
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"
          sha256sum app/build/outputs/bundle/release/app-release.aab > app/build/outputs/bundle/release/app-release.aab.sha256
          cat "$apk.sha256"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Remagnet Android $VERSION_NAME" \
            --generate-notes \
            "android/app/build/outputs/apk/release/app-release.apk" \
            "android/app/build/outputs/apk/release/app-release.apk.sha256" \
            "android/app/build/outputs/bundle/release/app-release.aab" \
            "android/app/build/outputs/bundle/release/app-release.aab.sha256"
