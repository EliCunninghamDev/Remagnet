name: Bug report
description: Report a problem in the browser extension, Android app, or Remagnet Proxy.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        **Never paste secrets or private data.** That includes Remagnet proxy tokens (`rmg_…`), passwords, qBittorrent API keys, and private URLs such as your proxy or Web UI address. Replace torrent names with something generic if you need to refer to one.

        If you do not have a GitHub account, you can email your report to [contact@elijahcunningham.dev](mailto:contact@elijahcunningham.dev).
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where did the problem occur?
      options:
        - Firefox extension
        - Chrome extension
        - Android app
        - Remagnet Proxy
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Remagnet version
      placeholder: e.g. 0.2.0
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what went wrong and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Optional — list the steps that trigger the problem.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Optional — paste or review the diagnostics generated by "Report an issue". No URLs, tokens, credentials, or torrent names.
