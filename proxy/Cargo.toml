[package]
name = "remagnet-proxy"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
crc32fast = "1"
flate2 = "1"
futures-lite = "2"
getrandom = "0.2"
hmac = "0.12"
percent-encoding = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
quick-xml = "0.41"
reqwest = { version = "0.12", default-features = false, features = [
  "cookies",
  "json",
  "multipart",
  "rustls-tls",
  "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "time",
] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
zip = { version = "4", default-features = false }

[profile.release]
lto = "thin"
strip = true
