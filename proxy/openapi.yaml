openapi: 3.1.0
info:
  title: Remagnet Proxy API
  version: 0.1.0
  summary: Neutral torrent adapter, ZIP streaming and configuration for Remagnet.
  description: |
    The Remagnet Proxy is the only component that talks to qBittorrent. It owns
    the qBittorrent Web UI credentials and the category/tags applied to Remagnet
    magnets, and exposes a client-neutral torrent API for the browser extension
    and Android app. qBittorrent credentials never leave the server, including
    during pairing.

    Client endpoints (`/api/health`, `/api/torrents*`, the archive ticket and the
    archive download) accept a per-device token, sent as
    `Authorization: Bearer rmg_…`. Administrative endpoints (`/api/config`,
    `/api/pair*`, `/api/devices*` and the `/api/auth/*` account routes) require
    the browser session cookie `remagnet_session`; a device token is rejected
    with `403` there. `GET /archive/{hash}` also accepts a single-use 60-second
    `?ticket=` minted by `POST /api/archive/{hash}/ticket`, so browsers and
    download managers never carry a long-lived token in a URL.

    `GET /api/auth/status`, `POST /api/auth/setup`, `POST /api/auth/login`,
    `POST /api/auth/device` and `POST /api/pair/claim` are public: they are how
    a client bootstraps credentials. Errors use a JSON body with an `error`
    field, plus an optional machine-readable `code`. Every `/api/*` response is
    sent with `Cache-Control: no-store`.

    `GET /healthz` and `GET /api/health` report `apiVersion`, the version of
    this HTTP contract. Clients can use it to detect an incompatible proxy
    before calling newer endpoints; it only changes for breaking changes.

    qBittorrent credentials are optional at boot. Until they are saved through
    `PUT /api/config`, the qBittorrent-backed endpoints return `503` with a
    setup message and `code: not_configured`.
servers:
  - url: http://127.0.0.1:8080
    description: Local development (`BIND_ADDR` default is `0.0.0.0:8080`).
  - url: https://remagnet.example.com
    description: Example deployment behind an HTTPS reverse proxy.
tags:
  - name: Service
    description: Unauthenticated liveness and the configuration page.
  - name: Configuration
    description: Read and update the qBittorrent connection and magnet defaults.
  - name: Auth
    description: Administrator setup, sign-in, two-factor and device token login.
  - name: Devices
    description: List, revoke, and self-revoke the per-device tokens that reach the client API.
  - name: Torrents
    description: Client-neutral torrent endpoints backed by qBittorrent.
  - name: Pairing
    description: Short-lived codes for onboarding the extension and Android app.
  - name: Archives
    description: Stream completed torrents as ZIP archives.
paths:
  /:
    get:
      operationId: getConfigPage
      summary: Configuration page
      description: |
        Static HTML page for setting the qBittorrent Web UI URL and credentials,
        plus the category and tags applied to new magnets. The page never
        receives saved secrets back. Served with `Cache-Control: no-store` and
        `X-Content-Type-Options: nosniff`.
      tags: [Service]
      security: []
      responses:
        "200":
          description: HTML configuration page.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            text/html:
              schema:
                type: string
  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: Reports that the process is running. Does not contact qBittorrent.
      tags: [Service]
      security: []
      responses:
        "200":
          description: The service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
              example:
                ok: true
                service: remagnet-proxy
                version: 0.1.0
                apiVersion: 1
  /api/health:
    get:
      operationId: checkQbitConnection
      summary: Read proxy capabilities and qBittorrent versions
      description: |
        Calls qBittorrent's `app/version` and `app/webapiVersion` endpoints with
        the saved credentials and reports the neutral capabilities and current
        magnet defaults. Used by the extension's connection test, the Android
        app and the configuration page. `apiVersion` is the client contract
        version; `proxyVersion` is this proxy crate's version.
      tags: [Configuration]
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: qBittorrent answered with its versions.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionHealth"
              example:
                ok: true
                clientLabel: qBittorrent
                appVersion: 5.3.0
                webApiVersion: 2.16.2
                apiVersion: 1
                proxyVersion: 0.1.0
                capabilities:
                  pauseOnAdd: true
                  archiveDownload: true
                  categories: true
                  tags: true
                  torrentFiles: true
                defaultCategory: remagnet
                defaultTags: [remagnet]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/config:
    get:
      operationId: getConfig
      summary: Read non-secret configuration
      description: |
        Returns the selected torrent client, its base URL and username, flags
        indicating whether an API key and password are saved, the optional
        read-only downloads mount and the category/tags applied to magnets.
        Secret values are never returned, and this endpoint does not contact the
        torrent client.

        Values supplied through environment variables (`CLIENT_KIND`,
        `CLIENT_BASE_URL`/`QBIT_BASE_URL`/`TRANSMISSION_BASE_URL`, `QBIT_API_KEY`,
        `CLIENT_USERNAME`/`QBIT_USERNAME`, `CLIENT_PASSWORD`/`QBIT_PASSWORD`,
        `DOWNLOADS_DIR`, `CLIENT_DOWNLOADS_DIR`, `REMAGNET_CATEGORY`, and
        `REMAGNET_TAGS`) override `config.json` and are listed in `envLocked`.
        Leave those fields disabled in the UI: a subsequent `PUT /api/config`
        keeps the environment value even if it sends a different one.
      tags: [Configuration]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current public configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfig"
              example:
                clientKind: qbittorrent
                baseUrl: http://gluetun:8080
                qbitBaseUrl: http://gluetun:8080
                username: ""
                qbitUsername: ""
                hasApiKey: true
                hasPassword: false
                downloadsDir: /downloads
                clientDownloadsDir: /data/torrents
                defaultCategory: remagnet
                defaultTags: [remagnet]
                configured: true
                envLocked: [apiKey, downloadsDir]
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateConfig
      summary: Update the torrent client connection and magnet defaults
      description: |
        Replaces the saved torrent client settings and returns the new public
        configuration. `baseUrl` is required unless the proxy is already
        configured or `baseUrl` is locked by an environment variable; omitting
        it keeps the current URL. It is normalized by trimming whitespace and
        trailing slashes; credentials in the URL, query strings and fragments
        are rejected. `qbitBaseUrl` is accepted as an alias.

        Fields listed in `envLocked` are read-only: a value sent for one is
        ignored and the environment value stays in effect. Environment-provided
        API keys and passwords are never written to `config.json`.

        For the secret fields (`apiKey`, `username`, `password`, plus the
        `qbit*` aliases), omitting a field keeps the saved value and sending an
        empty string clears it. Credentials are not required when saving: the
        proxy remains bootable and client-backed endpoints return `503` until
        setup is complete. Transmission only needs a URL; a private network can
        leave its optional username and password blank. Saving valid settings
        activates the client without a restart.

        `downloadsDir` enables ZIP archive downloads and should point at the
        client's downloads volume mounted read-only. `clientDownloadsDir` is an
        optional prefix mapping, such as `/data/torrents`, for torrent paths as
        the client reports them.

        `defaultCategory` and `defaultTags` are the values applied to every
        magnet added through the proxy. Omitting either field keeps the saved
        value. Tags are trimmed and deduplicated; an empty array clears the tag
        filter. When both the category and tags are empty, every torrent is
        exposed.
      tags: [Configuration]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigUpdate"
            examples:
              changeUrl:
                summary: Change the URL and keep saved secrets
                value:
                  baseUrl: https://qbt.example.com
              transmission:
                summary: Use Transmission without authentication
                value:
                  clientKind: transmission
                  baseUrl: http://transmission:9091
                  downloadsDir: /downloads
                  clientDownloadsDir: /data/torrents
              replaceCredentials:
                summary: Switch to username/password and clear the API key
                value:
                  baseUrl: http://gluetun:8080
                  apiKey: ""
                  username: admin
                  password: secret
              magnetDefaults:
                summary: Apply a category and tags to new magnets
                value:
                  baseUrl: http://gluetun:8080
                  defaultCategory: remagnet
                  defaultTags: [remagnet, nas]
      responses:
        "200":
          description: Configuration saved; the returned values are the effective ones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/torrents:
    get:
      operationId: listTorrents
      summary: List the torrents owned by Remagnet
      description: |
        Lists qBittorrent torrents sorted by added time (newest first) and
        filters them server-side with the configured category and tags. A torrent
        matches when its category equals the configured category
        (case-insensitively) or any of its tags equals a configured tag. When both
        defaults are empty, every torrent matches.
      tags: [Torrents]
      security:
        - bearerAuth: []
        - sessionCookie: []
      responses:
        "200":
          description: The filtered torrent list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorrentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: addTorrents
      summary: Add magnets, torrent URLs, or uploaded .torrent files
      description: |
        Adds the submitted torrents to the configured client with the proxy's
        category and tags. Send at least one entry in `urls` or `files`; a
        request where both are empty returns `400`. Clients cannot override the
        category or tags. A non-empty category is created first when missing, as
        are missing tags. With `paused: true` the proxy adds the torrents
        stopped.

        `urls` accepts `magnet:` links and http(s) URLs understood by the
        client. `files` carries raw `.torrent` metainfo as standard base64 in
        `data`; the proxy validates the bencode, computes the info hash, and
        sends the original bytes to qBittorrent as multipart or to Transmission
        as `metainfo`. Files larger than 10 MiB are rejected with `413`, and the
        overall JSON body is limited to 16 MiB.

        `hashes` contains the v1/v2 info hashes extracted from submitted
        `magnet:` URLs plus the info hashes of uploaded `.torrent` files;
        non-magnet URLs without an embedded hash contribute nothing. The client
        rejecting the torrent (for example because it already exists) returns
        `400` with an explanatory message.
      tags: [Torrents]
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTorrentRequest"
            examples:
              magnets:
                summary: Add magnet links
                value:
                  urls:
                    - magnet:?xt=urn:btih:dc555f7a26f1acae38a18edc04e53588ade33051
                  paused: false
              torrentFile:
                summary: Add an uploaded .torrent file
                value:
                  files:
                    - filename: debian-12.5.0-amd64-netinst.iso.torrent
                      data: ZDQ6aW5mb2Q2Omxlbmd0aGkxMDI0ZTQ6bmFtZTQ6dGVzdDEyOnBpZWNlIGxlbmd0aGkxNjM4NGU2OnBpZWNlczIwOjAxMjM0NTY3ODkwMTIzNDU2Nzg5MDpl
                  paused: true
      responses:
        "200":
          description: The torrent client accepted the add request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddTorrentResult"
        "400":
          description: |
            No URLs or files were supplied, the base64 or bencode was invalid, or
            the torrent client rejected the torrent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                empty:
                  value:
                    error: Add at least one magnet, torrent URL, or .torrent file.
                    code: bad_request
                rejected:
                  value:
                    error: qBittorrent rejected the torrent. It may already exist, or the magnet link may be invalid.
                    code: bad_request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/torrents/{hash}:
    get:
      operationId: getTorrent
      summary: Read one torrent by info hash
      description: |
        Fetches a torrent without applying the relevance filter. Clients use this
        for duplicate checks, so an existing torrent anywhere in qBittorrent is
        reported even when Remagnet does not own it.
      tags: [Torrents]
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Hash"
      responses:
        "200":
          description: The torrent in the neutral shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorrentSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: removeTorrent
      summary: Remove a torrent owned by Remagnet
      description: |
        Deletes a torrent only when it matches the proxy's configured
        category/tags filter. A torrent that does not exist, or that exists but
        is not owned by Remagnet, returns `404` so clients cannot remove
        unrelated torrents from a shared qBittorrent instance.
      tags: [Torrents]
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Hash"
        - name: deleteFiles
          in: query
          required: false
          description: Also delete the downloaded files.
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: The torrent was deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/pair:
    post:
      operationId: createPairing
      summary: Mint a short-lived device pairing code
      description: |
        Creates an in-memory pairing session and returns the `remagnet://pair`
        link plus a ready-to-display SVG QR code. The Remagnet Proxy page shows
        the QR for the Android app and copies the link for the extension, which
        claims it from Settings. The code is single-use and is never stored on
        disk; restarting the proxy invalidates outstanding sessions.

        Minting requires an administrator session. Claiming the code does not,
        because the device or extension claiming it has not been configured yet.
        Pairing carries a newly minted device token, so the origin must use
        HTTPS unless it is loopback or the Android emulator host (`10.0.2.2`).
      tags: [Pairing]
      security:
        - sessionCookie: []
      requestBody:
        required: false
        description: |
          The origin to encode in the link. The proxy page sends
          `location.origin`, which is the address the phone must be able to
          reach. When omitted, the proxy falls back to the `Host` and
          `X-Forwarded-Proto` headers.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePairingRequest"
      responses:
        "200":
          description: A pairing session and its rendered QR code.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingSession"
        "400":
          description: The supplied origin is invalid, unreachable without HTTPS, or missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Pairing needs an HTTPS Remagnet Proxy URL.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/pair/{id}:
    delete:
      operationId: revokePairing
      summary: Revoke an outstanding pairing code
      description: |
        Called when the proxy page hides or rotates the QR code. Revoking an
        unknown or expired id is not an error, so a retry is safe.
      tags: [Pairing]
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The session is gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/pair/claim:
    post:
      operationId: claimPairing
      summary: Claim a pairing code and receive the encrypted proxy token
      description: |
        The Android app, or the extension's pairing field, sends the session id
        and `SHA-256(code)`, not the code itself. On success the proxy consumes
        the session, mints a fresh per-device token and returns
        `{ version: 2, proxyToken }` encrypted with AES-256-GCM. Both sides
        derive the key from the scanned code and the session id, so a logged
        request or response is useless without the code. qBittorrent credentials
        are never included.

        Pairing is a second enrolment path and never asks for the administrator's
        second factor: the scanned code is the proof of presence. When
        `deviceName` is omitted the device is recorded as `Paired device`; it can
        be listed and revoked through `/api/devices`.

        The plaintext is a JSON object described by `PairingPayload`. Invalid,
        expired, or already-claimed codes return `400` and no payload.
      tags: [Pairing]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingClaim"
      responses:
        "200":
          description: Encrypted settings for the scanning device.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncryptedPayload"
        "400":
          description: The pairing code is invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: The pairing code is invalid or expired.
  /api/auth/status:
    get:
      operationId: getAuthStatus
      summary: Read setup and sign-in state
      description: |
        Public bootstrap probe used by the proxy page, the extension and the
        Android app. Reports whether an administrator account exists, whether the
        deployment requires a setup code, whether the request already carries a
        valid session, and whether two-factor authentication is enabled.
      tags: [Auth]
      security: []
      responses:
        "200":
          description: Current authentication state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
              example:
                initialized: true
                requiresSetupCode: false
                authenticated: false
                username: admin
                totpEnabled: false
  /api/auth/setup:
    post:
      operationId: setupAdmin
      summary: Create the administrator account
      description: |
        First-run enrolment. Fails with `409` once an administrator exists.
        When the deployment sets a setup code, `setupCode` must match it or the
        request returns `403`. The username is trimmed and must contain 1 to 64
        characters; the password must contain at least 12 characters. On success
        the account is saved, a session cookie is set and the response body is
        the same `AuthSession` returned by sign-in.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupAdminRequest"
      responses:
        "201":
          description: The administrator account was created and signed in.
          headers:
            Set-Cookie:
              description: |
                `remagnet_session=…; HttpOnly; SameSite=Strict; Path=/`.
                `Secure` is added when the request arrived over HTTPS.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The proxy is already set up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: The proxy is already set up. Sign in instead.
  /api/auth/login:
    post:
      operationId: loginAdmin
      summary: Sign in to the administrator account
      description: |
        Verifies the username and password, then the second factor when enabled.
        When two-factor authentication is enabled and `totpCode` is missing or
        empty, the response is `401` with `code: "totp_required"` so the client
        can ask for a code. A supplied code may be a TOTP code or an unused
        recovery code; recovery codes are consumed once. Repeated failures from
        one address are throttled with `429`. On success a session cookie is set.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in; the session cookie identifies the browser.
          headers:
            Set-Cookie:
              description: |
                `remagnet_session=…; HttpOnly; SameSite=Strict; Path=/`.
                `Secure` is added when the request arrived over HTTPS.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: |
            Bad credentials, a rejected two-factor code, or a missing code when
            two-factor authentication is enabled (`code: "totp_required"`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                badCredentials:
                  value:
                    error: Authentication required.
                totpRequired:
                  value:
                    error: Two-factor authentication code required.
                    code: totp_required
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/auth/logout:
    post:
      operationId: logoutAdmin
      summary: Sign out the current administrator session
      description: |
        Revokes the session cookie and clears it in the response. Requires an
        administrator session; a device token is not enough.
      tags: [Auth]
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The session was revoked and the cookie cleared.
          headers:
            Set-Cookie:
              description: Expired `remagnet_session` cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/auth/password:
    post:
      operationId: changePassword
      summary: Change the administrator password
      description: |
        Requires the current password and a new password of at least 12
        characters. Every existing session, including the caller's, is revoked;
        the response sets a fresh session cookie for the current browser.
      tags: [Auth]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: The password was changed and a fresh session cookie was set.
          headers:
            Set-Cookie:
              description: New `remagnet_session` cookie.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The current password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: The current password is incorrect.
  /api/auth/2fa/setup:
    post:
      operationId: setupTotp
      summary: Begin two-factor enrolment
      description: |
        Generates a new TOTP secret, stores it as pending and returns the secret,
        its `otpauth://` URI and an inline SVG QR code. The secret does not take
        effect until `POST /api/auth/2fa/enable` verifies a code.
      tags: [Auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: A pending secret and its QR code.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpSetup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/auth/2fa/enable:
    post:
      operationId: enableTotp
      summary: Confirm two-factor enrolment
      description: |
        Verifies a code against the pending secret, stores the secret on the
        administrator account and returns eight single-use recovery codes. The
        codes are shown only in this response. The current TOTP step is consumed,
        so the same code cannot immediately be used to sign in.
      tags: [Auth]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpCodeRequest"
      responses:
        "200":
          description: Two-factor authentication is enabled.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnabled"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/auth/2fa/disable:
    post:
      operationId: disableTotp
      summary: Disable two-factor authentication
      description: |
        Requires the administrator password and, when two-factor authentication is
        enabled, a valid TOTP or recovery code. Clears the secret, the replay
        marker and every remaining recovery code.
      tags: [Auth]
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisableTotpRequest"
      responses:
        "204":
          description: Two-factor authentication is disabled.
        "400":
          description: Two-factor authentication is enabled and no code was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Enter a two-factor or recovery code.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: The password is incorrect.
  /api/auth/device:
    post:
      operationId: loginDevice
      summary: Exchange credentials for a per-device token
      description: |
        Public alternative to pairing for clients that can prompt for the
        administrator username and password. Mints a `rmg_…` token scoped to the
        client API and returns it once with the new device record. When two-factor
        authentication is enabled, `totpCode` is required and a missing code
        returns `401` with `code: "totp_required"`. Failed attempts are throttled
        with `429`.

        The token can never reach administrative endpoints.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceLoginRequest"
      responses:
        "200":
          description: A new device token and its public device record.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLoginResponse"
        "401":
          description: |
            Bad credentials, a rejected two-factor code, or a missing code when
            two-factor authentication is enabled (`code: "totp_required"`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                badCredentials:
                  value:
                    error: Authentication required.
                totpRequired:
                  value:
                    error: Two-factor authentication code required.
                    code: totp_required
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/devices:
    get:
      operationId: listDevices
      summary: List registered devices
      description: |
        Returns every device token record. The raw token is never returned; only
        its id, name and timestamps are available. Requires an administrator
        session.
      tags: [Devices]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Registered devices, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/devices/current:
    delete:
      operationId: revokeCurrentDevice
      summary: Revoke the calling device's own token
      description: |
        Deletes the device record whose `Authorization: Bearer rmg_…` token made
        the request, which immediately invalidates that token. This lets the
        extension and Android app disconnect without administrator access; it
        only accepts a device token, never an administrator session cookie. The
        saved `auth.json` is updated before the response. A missing, invalid or
        already revoked token returns `401`.
      tags: [Devices]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The calling device token was revoked.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/devices/{id}:
    delete:
      operationId: revokeDevice
      summary: Revoke a device token
      description: |
        Deletes the device record, which immediately invalidates its token.
        Requires an administrator session. An unknown id returns `404`.
      tags: [Devices]
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Device id returned by `GET /api/devices`.
          schema:
            type: string
      responses:
        "204":
          description: The device token was revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No device has that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Device not found.
  /api/archive/{hash}/ticket:
    post:
      operationId: createArchiveTicket
      summary: Mint a single-use archive download ticket
      description: |
        Issues a 60-second, single-use ticket bound to this info hash. Devices
        use it instead of putting their long-lived token in a download URL, where
        it would leak into history and logs. The caller needs a device token or
        an administrator session; the ticket itself then authorizes exactly one
        `GET /archive/{hash}`.

        The torrent must exist and match the proxy's configured category/tags
        filter, the same ownership check used by `DELETE /api/torrents/{hash}`.
        Unrelated or unknown hashes return `404` and never receive a ticket.
      tags: [Archives]
      security:
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Hash"
      responses:
        "200":
          description: A ticket for one archive download.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /archive/{hash}:
    get:
      operationId: downloadArchive
      summary: Stream a completed torrent as a ZIP
      description: |
        Looks up the torrent by info hash, requires that it is complete (progress
        1, no bytes left, and not in `missingFiles` or `error`), lists its files
        and streams each one from qBittorrent into a stored ZIP entry. Nothing is
        buffered or written to disk.

        The torrent must also match the proxy's configured category/tags filter,
        the same ownership check used by `DELETE /api/torrents/{hash}`.
        Unrelated and unknown hashes return `404`, whether the caller uses a
        token, a session or a ticket.

        The response carries an exact `Content-Length`, computed from the stored
        ZIP layout (entry names, headers, data descriptors and the central
        directory) before the first upstream byte is read, including ZIP64
        records when sizes or offsets exceed 4 GiB. If an upstream file stream
        fails after the response has started, the connection is aborted instead
        of ending cleanly, so browsers do not save a truncated ZIP as a
        completed download.
      tags: [Archives]
      security:
        - bearerAuth: []
        - sessionCookie: []
        - archiveTicket: []
      parameters:
        - $ref: "#/components/parameters/Hash"
        - $ref: "#/components/parameters/TicketQuery"
      responses:
        "200":
          description: |
            ZIP archive streamed as `application/zip`. Entry names are sanitized
            relative paths inside the torrent; directories are omitted. The
            suggested filename is the sanitized torrent name with a `.zip`
            suffix.
          headers:
            Content-Length:
              description: Exact size in bytes of the stored ZIP archive.
              schema:
                type: integer
                format: int64
            Content-Disposition:
              description: Attachment filename with an ASCII fallback and RFC 5987 form.
              schema:
                type: string
              example: attachment; filename="Example Torrent.zip"; filename*=UTF-8''Example%20Torrent.zip
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            application/zip:
              schema:
                type: string
                format: binary
                contentMediaType: application/zip
        "400":
          description: The info hash is not 40 or 64 hexadecimal characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Expected a 40 or 64 character hex info hash.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            The torrent does not exist in qBittorrent, or it does not match the
            proxy's configured category/tags filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Torrent not found.
        "409":
          description: |
            The torrent is not complete yet, a file is still downloading, or the
            torrent has no files to archive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Example Torrent is not complete yet (42%).
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Per-device token minted by pairing or `POST /api/auth/device`. Send
        `Authorization: Bearer rmg_…`. Device tokens reach the client endpoints
        (`/api/health`, `/api/torrents*`, `POST /api/archive/{hash}/ticket` and
        `GET /archive/{hash}`) and never the administrative surface.
    sessionCookie:
      type: apiKey
      in: cookie
      name: remagnet_session
      description: |
        Administrator browser session set by `POST /api/auth/setup` or
        `POST /api/auth/login`. Required by `/api/config`, `/api/pair*`,
        `/api/devices*`, `/api/auth/logout`, `/api/auth/password` and the
        `/api/auth/2fa/*` routes.
    archiveTicket:
      type: apiKey
      in: query
      name: ticket
      description: |
        Single-use ticket bound to one info hash, minted by
        `POST /api/archive/{hash}/ticket` and valid for 60 seconds.
  parameters:
    TicketQuery:
      name: ticket
      in: query
      required: false
      description: |
        Single-use download ticket from `POST /api/archive/{hash}/ticket`.
        Alternative to a device token or administrator session; the ticket is
        consumed by the download and expires after 60 seconds.
      schema:
        type: string
    Hash:
      name: hash
      in: path
      required: true
      description: |
        Torrent info hash. Accepts a 40-character BitTorrent v1 hash or a
        64-character v2 hash, case-insensitively.
      schema:
        type: string
        pattern: "^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$"
      example: dc555f7a26f1acae38a18edc04e53588ade33051
  responses:
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Authentication required.
    Forbidden:
      description: |
        Authenticated, but not allowed to perform this action. Administrative
        routes return this for a valid device token; setup returns it for a
        wrong setup code.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Admin sign-in is required for this action.
    TooManyRequests:
      description: |
        Too many sign-in attempts from this address. `Retry-After` is the number
        of seconds to wait before trying again, and `code` is `rate_limited`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying sign-in.
          schema:
            type: integer
            minimum: 1
          example: 60
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Too many sign-in attempts. Try again in 60 seconds.
            code: rate_limited
    BadRequest:
      description: The request was rejected, for example an invalid URL, hash or field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Enter a valid http:// or https:// URL.
    PayloadTooLarge:
      description: |
        The request body or an uploaded `.torrent` file exceeds the limits.
        Individual `.torrent` files are limited to 10 MiB and the JSON body to
        16 MiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: An uploaded .torrent file is too large. The maximum is 10 MiB.
            code: payload_too_large
    NotFound:
      description: The torrent does not exist or does not match the proxy's filter.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Torrent not found.
    InternalError:
      description: |
        The proxy hit an unexpected internal error. The body uses
        `code: internal_error` and a generic message; technical detail is only
        written to the proxy logs.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: The Remagnet Proxy hit an unexpected internal error. Check the proxy container logs for details.
            code: internal_error
    BadGateway:
      description: |
        The configured torrent client could not be reached or returned an error.
        `code` distinguishes `upstream_unreachable`, `upstream_auth` and
        `upstream_error`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: |
        No torrent client has been configured on the proxy yet. The body carries
        `code: not_configured` so clients can distinguish this from other server
        failures.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ServiceUnavailable"
  schemas:
    Error:
      type: object
      description: |
        Error body returned by every failing request. `error` is safe to display
        to the user; `code` is stable and machine-readable.
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable message safe to display to the user.
        code:
          type: string
          description: |
            Stable machine-readable reason. Every error response includes one:

            - `bad_request`: the request was invalid (`400`)
            - `unauthorized`: missing or invalid credentials (`401`)
            - `totp_required`: a two-factor code is needed (`401`)
            - `forbidden`: authenticated but not allowed (`403`)
            - `not_found`: the resource does not exist (`404`)
            - `conflict`: the resource already exists or is in the wrong state (`409`)
            - `payload_too_large`: the request body or an uploaded `.torrent` file is too large (`413`)
            - `rate_limited`: too many attempts; see `Retry-After` (`429`)
            - `not_configured`: no torrent client is configured yet (`503`)
            - `upstream_unreachable`: the torrent client could not be reached or timed out (`502`)
            - `upstream_auth`: the torrent client rejected the saved credentials (`502`)
            - `upstream_error`: any other torrent client error (`502`)
            - `internal_error`: an unexpected proxy error (`500`)
          enum:
            - bad_request
            - unauthorized
            - totp_required
            - forbidden
            - not_found
            - conflict
            - payload_too_large
            - rate_limited
            - not_configured
            - upstream_unreachable
            - upstream_auth
            - upstream_error
            - internal_error
      additionalProperties: false
    ServiceUnavailable:
      type: object
      description: |
        Returned by torrent-client-backed endpoints before the proxy has
        credentials. Saving an API key, username, or client URL through
        `PUT /api/config` clears it.
      required: [error, code]
      properties:
        error:
          type: string
          example: No torrent client is configured yet. Open the Remagnet Proxy page to set it up.
        code:
          type: string
          const: not_configured
          description: Stable identifier for an unconfigured proxy.
      additionalProperties: false
    Liveness:
      type: object
      required: [ok, service, version, apiVersion]
      properties:
        ok:
          type: boolean
          description: Always true for a successful liveness probe.
          example: true
        service:
          type: string
          description: Historical service name kept for deployment compatibility.
          example: remagnet-proxy
        version:
          type: string
          description: Crate version from `CARGO_PKG_VERSION`.
        apiVersion:
          type: integer
          format: int32
          minimum: 1
          description: |
            Version of the client-facing HTTP contract. Currently `1`; it only
            changes for a breaking change.
          example: 1
      additionalProperties: false
    ClientKind:
      type: string
      description: |
        Torrent client adapted by the proxy. `qbittorrent` uses the qBittorrent
        Web API; `transmission` uses the Transmission RPC endpoint.
      enum: [qbittorrent, transmission]
      example: qbittorrent
    TorrentCapabilities:
      type: object
      description: Features the proxy supports through its neutral torrent API.
      required: [pauseOnAdd, archiveDownload, categories, tags, torrentFiles]
      properties:
        pauseOnAdd:
          type: boolean
          description: Whether `POST /api/torrents` accepts `paused`.
          example: true
        archiveDownload:
          type: boolean
          description: |
            Whether completed torrents can be streamed as ZIP archives. This is
            only true when `DOWNLOADS_DIR` points at the client's downloads
            volume.
          example: true
        categories:
          type: boolean
          description: Whether the adapted client supports categories.
          example: true
        tags:
          type: boolean
          description: |
            Whether the adapted client supports tags. Transmission exposes them
            as labels.
          example: true
        torrentFiles:
          type: boolean
          description: |
            Whether `POST /api/torrents` accepts uploaded `.torrent` files in
            `files`, not just magnet or torrent URLs.
          example: true
      additionalProperties: false
    ConnectionHealth:
      type: object
      description: |
        Successful qBittorrent connection check plus the effective magnet defaults.
      required:
        - ok
        - clientLabel
        - appVersion
        - webApiVersion
        - apiVersion
        - proxyVersion
        - capabilities
        - defaultCategory
        - defaultTags
      properties:
        ok:
          type: boolean
          description: Always true when qBittorrent answers.
          example: true
        clientLabel:
          type: string
          description: Human-readable name of the adapted torrent client.
          example: qBittorrent
        appVersion:
          type: string
          description: qBittorrent application version reported by qBittorrent.
          example: 5.3.0
        webApiVersion:
          type: string
          description: qBittorrent Web API version reported by qBittorrent.
          example: 2.16.2
        apiVersion:
          type: integer
          format: int32
          minimum: 1
          description: |
            Version of the client-facing HTTP contract. Currently `1`; it only
            changes for a breaking change.
          example: 1
        proxyVersion:
          type: string
          description: Version of this Remagnet Proxy build from `CARGO_PKG_VERSION`.
          example: 0.1.0
        capabilities:
          $ref: "#/components/schemas/TorrentCapabilities"
        defaultCategory:
          type: string
          description: Category applied to new magnets and used for filtering.
          example: remagnet
        defaultTags:
          type: array
          description: Tags applied to new magnets and used for filtering.
          items:
            type: string
          example: [remagnet]
      additionalProperties: false
    TorrentSummary:
      type: object
      description: |
        A torrent in the client-neutral shape shared by the browser extension and
        Android app. `state` is normalized from qBittorrent's vocabulary.
      required:
        - hash
        - name
        - state
        - progress
        - size
        - downloadSpeed
        - uploadSpeed
        - eta
        - ratio
        - category
        - tags
        - seeds
        - peers
      properties:
        hash:
          type: string
          description: Torrent info hash, lowercase when qBittorrent returns it that way.
          example: dc555f7a26f1acae38a18edc04e53588ade33051
        name:
          type: string
          description: Torrent display name.
        state:
          type: string
          description: |
            Normalized state. Known values are `checking`, `downloading`,
            `metadata`, `stalled`, `queued`, `moving`, `seeding`, `stopped`,
            `error`, `missingFiles` and `unknown`; unrecognized qBittorrent
            states pass through unchanged.
          example: downloading
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Completion from 0 to 1.
        size:
          type: integer
          format: int64
          minimum: 0
          description: Total torrent size in bytes.
        downloadSpeed:
          type: integer
          format: int64
          minimum: 0
          description: Current download speed in bytes per second.
        uploadSpeed:
          type: integer
          format: int64
          minimum: 0
          description: Current upload speed in bytes per second.
        eta:
          type: integer
          format: int64
          description: Seconds until completion; qBittorrent's sentinel for unknown.
          example: 60
        ratio:
          type: number
          format: double
          description: Share ratio.
        category:
          type: string
          description: qBittorrent category, or an empty string.
        tags:
          type: array
          description: Split qBittorrent tags without empty entries.
          items:
            type: string
        seeds:
          type: integer
          format: int64
          minimum: 0
          description: Connected seeds.
        peers:
          type: integer
          format: int64
          minimum: 0
          description: Connected peers (qBittorrent `num_leechs`).
      additionalProperties: false
    TorrentList:
      type: object
      required: [torrents]
      properties:
        torrents:
          type: array
          description: Torrents matching the configured category/tags filter.
          items:
            $ref: "#/components/schemas/TorrentSummary"
      additionalProperties: false
    TorrentFileUpload:
      type: object
      description: |
        One raw `.torrent` metainfo file. `data` is standard base64 with padding,
        not an OpenAPI `format: byte` string: OpenAPI Generator's Kotlin
        `ByteArrayAdapter` decodes byte fields with UTF-8 `String(value)`, which
        corrupts binary torrent bytes. Sending a plain base64 string keeps the
        original bytes intact.
      required: [data]
      properties:
        filename:
          type: string
          description: |
            Original `.torrent` filename, for example `debian.torrent`. The proxy
            keeps only the basename and ensures a `.torrent` suffix; when omitted
            it uses `<infoHash>.torrent`.
          example: debian.torrent
        data:
          type: string
          minLength: 1
          description: |
            Standard base64-encoded raw `.torrent` metainfo bytes. The proxy
            validates the bencode and rejects files over 10 MiB with `413`.
          example: ZDQ6aW5mb2Q2Omxlbmd0aGkxMDI0ZTQ6bmFtZTQ6dGVzdDEyOnBpZWNlIGxlbmd0aGkxNjM4NGU2OnBpZWNlczIwOjAxMjM0NTY3ODkwMTIzNDU2Nzg5MDpl
      additionalProperties: false
    AddTorrentRequest:
      type: object
      description: |
        Magnets, torrent URLs, or uploaded `.torrent` files to add. At least one
        of `urls` or `files` must be non-empty. Category and tags are
        intentionally not accepted: the proxy always applies its configured
        defaults.
      properties:
        urls:
          type: array
          default: []
          items:
            type: string
          description: |
            Magnet links or http(s) URLs understood by the client. Optional when
            `files` is non-empty.
        files:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/TorrentFileUpload"
          description: |
            Raw `.torrent` files to add. Optional when `urls` is non-empty.
        paused:
          type: boolean
          default: false
          description: Add the torrents stopped instead of starting them immediately.
      additionalProperties: false
    AddTorrentResult:
      type: object
      required: [added, hashes, category, tags]
      properties:
        added:
          type: integer
          minimum: 0
          description: |
            Number of submitted magnet/torrent URLs plus uploaded `.torrent`
            files.
        hashes:
          type: array
          description: |
            Info hashes from submitted `magnet:` URLs plus the computed info
            hashes of uploaded `.torrent` files.
          items:
            type: string
            pattern: "^([0-9a-f]{40}|[0-9a-f]{64})$"
        category:
          type: string
          description: Category the proxy applied to the added torrents.
        tags:
          type: array
          description: Tags the proxy applied to the added torrents.
          items:
            type: string
      additionalProperties: false
    PublicConfig:
      type: object
      description: |
        Non-secret view of the saved configuration. Secret values are represented
        only by booleans.
      required:
        - clientKind
        - baseUrl
        - qbitBaseUrl
        - username
        - qbitUsername
        - hasApiKey
        - hasPassword
        - downloadsDir
        - clientDownloadsDir
        - defaultCategory
        - defaultTags
        - configured
        - envLocked
      properties:
        clientKind:
          $ref: "#/components/schemas/ClientKind"
        baseUrl:
          type: string
          format: uri
          description: |
            Normalized torrent client URL without a trailing slash. For
            qBittorrent this is the Web UI URL; for Transmission it is the RPC
            endpoint.
          example: http://gluetun:8080
        qbitBaseUrl:
          type: string
          format: uri
          description: |
            Deprecated alias for `baseUrl`, kept for older clients. Always has
            the same value.
          example: http://gluetun:8080
        username:
          type: string
          description: Saved torrent client username, or an empty string.
        qbitUsername:
          type: string
          description: Deprecated alias for `username`, kept for older clients.
        hasApiKey:
          type: boolean
          description: Whether a qBittorrent API key is saved.
        hasPassword:
          type: boolean
          description: Whether a torrent client password is saved.
        downloadsDir:
          type: string
          description: |
            Path on the proxy where the client's downloads volume is mounted
            read-only, or an empty string when ZIP streaming is disabled.
          example: /downloads
        clientDownloadsDir:
          type: string
          description: |
            Optional prefix of torrent download paths as seen by the torrent
            client, used to map them under `downloadsDir`.
          example: /data/torrents
        defaultCategory:
          type: string
          description: Category applied to new magnets and used for filtering.
          example: remagnet
        defaultTags:
          type: array
          description: |
            Tags applied to new magnets and used for filtering. Transmission
            exposes tags as labels.
          items:
            type: string
          example: [remagnet]
        configured:
          type: boolean
          description: |
            Whether enough torrent client settings are saved to talk to the
            client. When false, client-backed endpoints return `503` and the UI
            should ask the administrator to finish setup.
          example: true
        envLocked:
          type: array
          description: |
            camelCase names of fields overridden by environment variables and
            therefore read-only in the config UI. Any value sent for these fields
            in `PUT /api/config` is ignored.
          items:
            type: string
          example: [apiKey, downloadsDir]
      additionalProperties: false
    ConfigUpdate:
      type: object
      description: |
        Fields the config page may change. A missing field keeps the saved value.
        For secret fields, sending an empty string clears the value.

        `baseUrl` is required only when no URL is saved yet and the field is not
        locked by an environment variable; otherwise omitting it keeps the
        current URL. Fields reported in `envLocked` are ignored when sent.
      properties:
        clientKind:
          $ref: "#/components/schemas/ClientKind"
        baseUrl:
          type: string
          format: uri
          minLength: 1
          description: |
            Torrent client URL. Must use `http://` or `https://`, must not
            contain credentials, a query or a fragment, and is stored without
            trailing slashes. `qbitBaseUrl` is accepted as an alias.
          example: http://gluetun:8080
        qbitBaseUrl:
          type: string
          format: uri
          minLength: 1
          description: |
            Alias for `baseUrl`, kept for older clients. Do not send both
            fields in one request.
          example: http://gluetun:8080
        apiKey:
          type: string
          description: |
            qBittorrent 5.2+ API key. Omit to keep the saved key; send an empty
            string to clear it. `qbitApiKey` is accepted as an alias.
        qbitApiKey:
          type: string
          description: Alias for `apiKey`, kept for older clients.
        username:
          type: string
          description: |
            Torrent client username. Omit to keep the saved username; send an
            empty string to clear it. `qbitUsername` is accepted as an alias.
        qbitUsername:
          type: string
          description: Alias for `username`, kept for older clients.
        password:
          type: string
          description: |
            Torrent client password. Omit to keep the saved password; send an
            empty string to clear it. `qbitPassword` is accepted as an alias.
        qbitPassword:
          type: string
          description: Alias for `password`, kept for older clients.
        downloadsDir:
          type: string
          description: |
            Path on the proxy where the client's downloads volume is mounted
            read-only. Required for ZIP archive downloads; send an empty string
            to disable them.
          example: /downloads
        clientDownloadsDir:
          type: string
          description: |
            Optional prefix of torrent download paths as seen by the torrent
            client, such as `/data/torrents`. Used together with `downloadsDir`
            to locate completed files.
          example: /data/torrents
        defaultCategory:
          type: string
          description: |
            Category applied to new magnets and used to decide which torrents
            Remagnet owns. Omit to keep the saved value; send an empty string to
            disable category matching.
          example: remagnet
        defaultTags:
          type: array
          description: |
            Tags applied to new magnets and used to decide which torrents
            Remagnet owns. Omit to keep the saved value; send an empty array to
            disable tag matching. Entries are trimmed and deduplicated.
          items:
            type: string
          example: [remagnet]
      additionalProperties: false
    CreatePairingRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: |
            Proxy origin to put in the pairing link, such as
            `https://remagnet.example.com`. Must not contain credentials, a
            path, a query, or a fragment. Plain HTTP is accepted only for
            loopback and `10.0.2.2`.
          example: https://remagnet.example.com
      additionalProperties: false
    PairingSession:
      type: object
      description: Credentials for one QR image. The code is shown only once.
      required: [id, code, expiresIn, url, uri, svg]
      properties:
        id:
          type: string
          description: Base64url session id; safe to send back when claiming.
          example: 5J0m3x0YbqQ0m9jX8m3c2A
        code:
          type: string
          description: |
            Base64url 32-byte secret. Put it in the QR image, never in logs or
            analytics.
          example: 8m3c2A5J0m3x0YbqQ0m9jX8m3c2A5J0m3x0YbqQ0m9jX8
        expiresIn:
          type: integer
          description: Seconds until the code stops working.
          example: 60
        url:
          type: string
          format: uri
          description: Normalized proxy origin encoded in the link.
          example: https://remagnet.example.com
        uri:
          type: string
          description: |
            `remagnet://pair` link for the Android app and the extension's
            pairing field.
          example: remagnet://pair?url=https%3A%2F%2Fremagnet.example.com&id=…&code=…
        svg:
          type: string
          description: |
            Inline SVG QR code for `uri`, black on white. Generated by the proxy
            so the page does not load a QR library.
      additionalProperties: false
    PairingClaim:
      type: object
      required: [id, proof]
      properties:
        id:
          type: string
          description: Session id from the scanned QR code.
        proof:
          type: string
          description: |
            Base64url `SHA-256(code)`. The code itself is not sent, so request
            logs do not contain the key used for the response.
        deviceName:
          type: string
          description: |
            Optional human-readable name for the device record, up to 64
            characters. Defaults to `Paired device` when omitted.
          example: Pixel 9
      additionalProperties: false
    EncryptedPayload:
      type: object
      description: |
        AES-256-GCM output. The key is
        `SHA-256("remagnet-pair-v1" || id || code)`; the same derivation is used
        by the Android client.
      required: [iv, data]
      properties:
        iv:
          type: string
          description: Base64url 12-byte nonce.
        data:
          type: string
          description: Base64url ciphertext with the 16-byte GCM tag appended.
      additionalProperties: false
    PairingPayload:
      type: object
      description: |
        Plaintext inside `EncryptedPayload.data` after decryption. qBittorrent
        credentials are never part of this payload.
      required: [version, proxyToken]
      properties:
        version:
          type: integer
          const: 2
          description: Pairing payload version.
        proxyToken:
          type: string
          description: |
            A freshly minted per-device token (`rmg_…`) scoped to the client
            API, so the client can call the torrent and archive endpoints.
      additionalProperties: false
    AuthStatus:
      type: object
      description: Public snapshot of the proxy's authentication state.
      required: [initialized, requiresSetupCode, authenticated, username, totpEnabled]
      properties:
        initialized:
          type: boolean
          description: Whether an administrator account exists.
        requiresSetupCode:
          type: boolean
          description: Whether first-run setup requires a deployment setup code.
        authenticated:
          type: boolean
          description: Whether the request carries a valid session for `username`.
        username:
          type: [string, "null"]
          description: Administrator username, or null before setup.
        totpEnabled:
          type: boolean
          description: Whether two-factor authentication is enabled.
      additionalProperties: false
    SetupAdminRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: Administrator username; surrounding whitespace is trimmed.
        password:
          type: string
          minLength: 12
          description: Password, at least 12 characters.
        setupCode:
          type: string
          description: |
            Deployment setup code. Required only when the proxy was started with
            one configured.
      additionalProperties: false
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        totpCode:
          type: string
          description: |
            TOTP code or unused recovery code. Required when two-factor
            authentication is enabled.
      additionalProperties: false
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 12
          description: New password, at least 12 characters.
      additionalProperties: false
    AuthSession:
      type: object
      description: The signed-in administrator. The session travels in a cookie.
      required: [username, totpEnabled]
      properties:
        username:
          type: string
        totpEnabled:
          type: boolean
          description: Whether two-factor authentication is enabled for the account.
      additionalProperties: false
    TotpSetup:
      type: object
      required: [secret, otpauthUri, svg]
      properties:
        secret:
          type: string
          description: Base32 TOTP secret for manual entry into an authenticator.
        otpauthUri:
          type: string
          description: "`otpauth://totp/...` URI for authenticator apps."
        svg:
          type: string
          description: Inline SVG QR code for `otpauthUri`.
      additionalProperties: false
    TotpCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: TOTP code from the authenticator app.
      additionalProperties: false
    TotpEnabled:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          minItems: 8
          maxItems: 8
          items:
            type: string
          description: |
            Eight single-use recovery codes. Shown only once; each replaces a
            TOTP code at sign-in and is then consumed.
      additionalProperties: false
    DisableTotpRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: Current administrator password.
        code:
          type: string
          description: |
            TOTP or recovery code. Required when two-factor authentication is
            currently enabled.
      additionalProperties: false
    PublicDevice:
      type: object
      description: A device token record without the token itself.
      required: [id, name, createdAt, lastUsedAt]
      properties:
        id:
          type: string
          description: Stable device id used to revoke the token.
        name:
          type: string
          description: Human-readable device name.
          example: Pixel 9
        createdAt:
          type: integer
          format: int64
          minimum: 0
          description: Unix timestamp in seconds when the token was minted.
        lastUsedAt:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: Unix timestamp in seconds of the last authenticated request.
      additionalProperties: false
    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/PublicDevice"
      additionalProperties: false
    DeviceLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        totpCode:
          type: string
          description: TOTP or recovery code when two-factor authentication is enabled.
        deviceName:
          type: string
          description: Optional name for the new device record.
          example: Pixel 9
      additionalProperties: false
    DeviceLoginResponse:
      type: object
      required: [token, device]
      properties:
        token:
          type: string
          description: |
            New per-device token (`rmg_…`). Shown only once; store it securely.
          example: rmg_7Q2r…
        device:
          $ref: "#/components/schemas/PublicDevice"
      additionalProperties: false
    ArchiveTicket:
      type: object
      required: [ticket, expiresIn]
      properties:
        ticket:
          type: string
          description: Single-use ticket for `GET /archive/{hash}?ticket=…`.
        expiresIn:
          type: integer
          minimum: 0
          description: Seconds until the ticket expires.
          example: 60
      additionalProperties: false
